<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-Country Escape</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="writegrow-responsive.css">
<script src="writegrow-bridge.js"></script>
<style>
:root{
  /* Layout idea: a vintage travel passport. One column: stamp book on top, illustrated stop banner, then a poster-style puzzle card. */
  --paper:#F3E6C8;
  --paper-2:#FBF3DD;
  --ink:#25303B;
  --rust:#C6502D;
  --teal:#2E7D7A;
  --mustard:#E3A72F;
  --ne:#8FB3E0; --se:#F2A65A; --mw:#A8CF7A; --sw:#E87D6B; --w:#C6A5E0;
  --good:#7CC47C; --bad:#E8806B;
  --display:'Alfa Slab One','Rockwell','Georgia',serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--body);-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:12px 16px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,9vw,54px);letter-spacing:.5px}
h2{font-size:clamp(24px,6vw,32px)}
p{margin:0}
b{font-weight:700}
.eyebrow{font:700 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--rust);margin-bottom:8px}
.story{margin:10px 0 16px;max-width:62ch}

/* header: stamp book */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.book{display:flex;gap:7px}
.slot{width:40px;height:40px;border-radius:50%;border:2.5px dashed var(--ink);display:grid;place-items:center;font:400 19px var(--display);opacity:.5}
.slot.cur{opacity:1;border-color:var(--rust);color:var(--rust)}
.slot.on{opacity:1;border:3px solid var(--ink);background:var(--mustard);color:var(--ink);transform:rotate(-8deg);box-shadow:2px 2px 0 var(--ink)}
.slot.on:nth-child(even){transform:rotate(7deg)}

/* banner and panel */
.banner{border:3px solid var(--ink);border-radius:14px;overflow:hidden;height:132px;box-shadow:4px 4px 0 var(--ink);margin-bottom:18px;background:var(--ink)}
.banner svg{display:block;width:100%;height:100%}
.panel{background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;padding:20px 18px 22px;box-shadow:4px 4px 0 var(--ink)}

/* buttons */
.btn{font:700 17px/1.2 var(--body);color:var(--paper-2);background:var(--rust);border:3px solid var(--ink);border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.tile:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.btn.alt{background:var(--teal)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border-width:2.5px}
.btn.ghost:hover{background:var(--paper)}
.btn.small{font-size:15px;padding:8px 12px;min-height:40px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:2px 2px 0 var(--ink)}
.btn.big{font-size:20px;padding:14px 26px}

/* messages and hints */
.meta{font-size:15px;margin-bottom:10px;color:var(--ink)}
.lead{margin:14px 0 8px;font-weight:700}
.msg{min-height:28px;margin-top:10px;font-weight:700}
.msg.ok{color:#1F6B3A}
.msg.no{color:#9C2F14}
.hintbox{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{flex:1 1 220px;font-style:italic;padding:8px 12px;border-left:5px solid var(--mustard);background:var(--paper)}
.hint:empty{display:none}

/* levels, icons, route pictures */
.levels{display:flex;gap:10px;margin:14px 0 4px}
.btn.lv{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;background:var(--paper);color:var(--ink)}
.btn.lv small{font:600 12px var(--body);opacity:.8}
.btn.lv[aria-pressed="true"]{background:var(--teal);color:var(--paper-2)}
.ico{height:1.2em;width:auto;vertical-align:-.25em;margin-right:6px}
.route-pic{display:block;max-width:230px;margin:10px auto 0}
.winpose{display:block;height:130px;width:auto;margin:0 auto 4px}
/* map skills */
.txmap .tapdot.off{display:none}
.regguide{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:10px 12px;margin:6px 0 8px;font-size:15px;line-height:1.3}
.regguide b{display:block;font:400 16px var(--display);margin-bottom:4px}
.regguide span{display:block;margin:3px 0}
.regguide i{font-style:normal;font-weight:800}
.levels.games .btn.lv{font-size:15px;padding:9px 4px}
.levels.games{margin-top:0;margin-bottom:12px}
.homebg{background:linear-gradient(180deg,#2b6f8f 0%,#6fb6c9 38%,#f3d78c 72%,#c6502d 100%) fixed;background-image:url(art/scenes/home-bg.jpg),linear-gradient(180deg,#2b6f8f 0%,#6fb6c9 38%,#f3d78c 72%,#c6502d 100%);background-size:cover;background-position:center;background-attachment:fixed}
.homecard{background:rgba(252,243,220,.93);backdrop-filter:blur(2px)}
.logowrap{text-align:center;margin:-4px 0 4px}
.homelogo{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.logofall{font-size:34px;line-height:1.05;text-align:center;margin:6px 0}
.backrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.gchip{font-weight:800;font-size:14px;background:#F3D78C;border:2px solid #25303B;border-radius:999px;padding:4px 12px}
.subjgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.subj{background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;text-align:center;font-size:16px}
.btn.subj span{display:flex;flex-direction:column;line-height:1.2}
.btn.subj small{font-weight:600;font-size:12px;opacity:.75}
.subjimg{width:64px;height:64px;object-fit:contain}
.town{display:block;width:100%;height:auto}
.town .land{fill:#CFE8B8;stroke:#25303B;stroke-width:2.5}
.town .gl{stroke:#25303B;stroke-opacity:.28;stroke-width:1.2;stroke-dasharray:5 5}
.town .axis{font:800 17px var(--body);fill:#25303B;text-anchor:middle}
.town .nm{font:800 14px var(--body);fill:#25303B;text-anchor:middle;paint-order:stroke;stroke:rgba(243,230,200,.9);stroke-width:4px}
.town .cell{fill:transparent;cursor:pointer;outline:none}
.town .cell:hover{fill:rgba(227,167,47,.35)}
.town .cell:focus-visible{stroke:var(--teal);stroke-width:3}
.town .cell.good{fill:rgba(78,138,90,.6)}
.town .cell.bad{fill:rgba(198,80,45,.5);animation:pop .4s}
.txmap .txland{fill:#F3E6C8;stroke:#25303B;stroke-width:2.2;stroke-linejoin:round}
.txmap .dot{fill:#C6502D;stroke:#25303B;stroke-width:2}
.txmap .tapdot{cursor:pointer;outline:none}
.txmap .tapdot:hover .dot,.txmap .tapdot:focus-visible .dot{fill:#E3A72F}
.txmap .tapdot.good .dot{fill:#4E8A5A}
.txmap .tapdot.bad .dot{fill:#C6502D;animation:pop .4s}
.txmap .cname{font:800 11px var(--body);fill:#25303B;pointer-events:none;paint-order:stroke;stroke:rgba(243,230,200,.9);stroke-width:3px}
.towns{margin:6px -6px}
.compass-row{display:flex;gap:12px;align-items:center;margin:4px 0 8px}
.compass-row .note,.scalebar .note{margin:0;font-size:16px}
.scalebar{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:6px}
.key{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.key b{flex-basis:100%;font:400 16px var(--display)}
.keyrow{display:flex;align-items:center;gap:6px;font-weight:700}
.bigsym{display:inline-block;vertical-align:middle;margin-right:8px}
.pick svg{display:block;margin:0 auto}
/* the real map: one shape per state */
.mapwrap{margin:6px -10px}
.map{display:block;width:100%;height:auto}
.map .sea{fill:#CFE4E6;pointer-events:none}
.tile{cursor:pointer;outline:none}
.tile .shape{fill:var(--paper);stroke:var(--ink);stroke-width:2;stroke-linejoin:round;transition:fill .15s;transform-box:fill-box;transform-origin:center}
.tile text{font:700 28px var(--body);fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:rgba(243,230,200,.75);stroke-width:4px;text-anchor:middle}
.tile .chip text{font-size:22px;stroke:none}
.tile .lead{stroke:var(--ink);stroke-width:1.6;fill:none;pointer-events:none}
.tile .chip{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.map:not(.color) .tile:not(.good):not(.start):hover .shape{fill:var(--mustard)}
.tile:focus-visible .shape{stroke:var(--teal);stroke-width:5}
.map.color .r-NE .shape{fill:var(--ne)}
.map.color .r-SE .shape{fill:var(--se)}
.map.color .r-MW .shape{fill:var(--mw)}
.map.color .r-SW .shape{fill:var(--sw)}
.map.color .r-W .shape{fill:var(--w)}
.map.color .tile.hl .shape{stroke-width:4}
.map.color .tile:not(.hl){opacity:.94}
.tile.good .shape{fill:var(--good)!important}
.tile.bad .shape{fill:var(--bad)!important;animation:pop .4s}
.tile.start .shape{fill:var(--teal)!important}
.tile.start text{fill:var(--paper-2);stroke:none}
.tile.pulse .shape{animation:pop .5s 2}
.map.hero{pointer-events:none;max-width:560px;margin:0 auto}
.route{fill:none;stroke:var(--rust);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 17;pointer-events:none}

/* postcards */
.postcard{display:grid;grid-template-columns:1fr 96px;gap:14px;background:var(--paper-2);padding:16px;border:10px solid;border-image:repeating-linear-gradient(135deg,var(--rust) 0 14px,var(--paper-2) 14px 24px,var(--teal) 24px 38px,var(--paper-2) 38px 48px) 10;min-height:150px}
.pm{font:700 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--rust);margin-bottom:8px}
.clue{font-size:18px}
.stampzone{border:2.5px dashed var(--ink);border-radius:6px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--ink);opacity:.9;height:96px;position:relative}
.stampzone span{opacity:.55}
.rubber{font:400 14px/1.1 var(--display);color:var(--rust);border:4px double var(--rust);border-radius:50%;width:88px;height:88px;display:grid;place-items:center;text-align:center;padding:6px;transform:rotate(-12deg);animation:stampIn .35s cubic-bezier(.2,1.6,.4,1)}
.regbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.btn.reg{color:var(--ink)}
.btn.reg.r-NE{background:var(--ne)}.btn.reg.r-SE{background:var(--se)}.btn.reg.r-MW{background:var(--mw)}.btn.reg.r-SW{background:var(--sw)}.btn.reg.r-W{background:var(--w)}

/* capitals */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.cols h3{font-size:16px;margin-bottom:2px;grid-column:auto}
.pick{display:block;width:100%;text-align:left;font:700 17px/1.2 var(--body);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:12px;min-height:50px;cursor:pointer}
.pick:hover{background:var(--mustard)}
.pick.sel{background:var(--mustard);box-shadow:inset 0 0 0 3px var(--rust)}
.pick.done{background:var(--good);cursor:default;opacity:.95}
.pick.wrong{animation:shake .35s;background:var(--bad)}
.stack{display:flex;flex-direction:column;gap:10px}

/* choices */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.choices .pick.dead{opacity:.45;text-decoration:line-through}
.qtext{font-size:19px;font-weight:700}
.passage{background:#FFF8E8;border:2px solid #25303B;border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:17px;font-weight:500;line-height:1.5}
.mfig{display:block;margin:0 auto 10px;width:100%;max-width:280px;height:auto}
.mtab{margin:0 auto 10px;border-collapse:collapse;font-size:18px;font-weight:700}
.mtab th,.mtab td{border:2px solid #25303B;padding:6px 14px;text-align:center;background:#FFF8E8}
.mtab th{background:#F3D78C}
.fact{margin-top:10px;padding:10px 12px;background:var(--paper);border:2.5px solid var(--ink);border-radius:10px}

/* earned stamp */
.earned{text-align:center;padding:10px 0 4px}
.bigstamp{width:150px;height:150px;margin:6px auto 16px;border-radius:50%;border:6px double var(--ink);background:var(--mustard);display:grid;place-items:center;font:400 80px var(--display);transform:rotate(-10deg);animation:stampIn .5s cubic-bezier(.2,1.6,.4,1);box-shadow:4px 4px 0 var(--ink)}
.earned p{margin:6px auto 18px;max-width:46ch}

/* vault */
.slots,.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.vslot{width:58px;height:70px;border:3px dashed var(--ink);border-radius:10px;display:grid;place-items:center;font:400 34px var(--display);background:var(--paper);cursor:pointer;padding:0;color:var(--ink)}
.vslot.full{border-style:solid;background:var(--mustard)}
.vtile{width:58px;height:70px;border:3px solid var(--ink);border-radius:10px;background:var(--teal);color:var(--paper-2);font:400 34px var(--display);cursor:pointer;box-shadow:3px 3px 0 var(--ink);padding:0}
.vtile:disabled{visibility:hidden}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.shake{animation:shake .35s}
.opened .vault-door{transform-origin:30px 75px;animation:swing 1.1s forwards}

/* intro and win */
.hero-card{background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;padding:22px 18px 24px;box-shadow:4px 4px 0 var(--ink)}
.hero-card h1{margin:4px 0 12px}
.namebox{display:flex;flex-direction:column;gap:6px;margin:18px 0 16px}
.namebox label{font-weight:700}
.namebox input{font:400 19px var(--body);padding:12px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);min-height:48px}
details{margin-top:20px;border-top:2px dashed var(--ink);padding-top:12px}
summary{cursor:pointer;font-weight:700}
details p{margin-top:8px;font-size:16px}
.cert{border:10px solid;border-image:repeating-linear-gradient(135deg,var(--rust) 0 14px,var(--paper-2) 14px 24px,var(--teal) 24px 38px,var(--paper-2) 38px 48px) 10;background:var(--paper-2);padding:22px 16px;text-align:center}
.cert h1{font-size:clamp(28px,7vw,42px)}
.cert .who{font:400 clamp(26px,7vw,38px) var(--display);color:var(--rust);margin:12px 0;word-break:break-word}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:16px}
th,td{padding:8px 6px;border-bottom:2px solid var(--ink);text-align:left;vertical-align:top}
th{font-size:13px;letter-spacing:.1em;text-transform:uppercase}
td.num{text-align:center;font-variant-numeric:tabular-nums}
.report{margin-top:22px}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes stampIn{0%{transform:scale(2.4) rotate(0);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes swing{to{transform:perspective(300px) rotateY(-75deg)}}
@media (max-width:420px){
  .postcard{grid-template-columns:1fr;}
  .stampzone{width:96px;justify-self:end}
  .cols{gap:8px}
  .pick{font-size:16px;padding:10px 8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

.banner{position:relative;height:auto;aspect-ratio:16/9}
.banner .scene-art{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.title-art{margin-top:16px}
.title-atlas{position:absolute;left:9%;bottom:8%;height:76%;width:auto}
.stop-title{color:#fff8e6;background:#663423 url('art/ui/stop-title-ribbon.png') center/100% 100% no-repeat;border-radius:20px;padding:12px 17%;text-align:center}
.briefing{display:flex;align-items:center;gap:12px}
.guide{width:clamp(64px,16vw,106px);height:110px;object-fit:contain;flex:none}
.clue-art[hidden]{display:none}
.clue-art{display:block;width:min(100%,250px);margin:12px auto;border-radius:9px}
.landform{width:min(100%,220px)}
.slot.on{background:none;border:0;box-shadow:none;transform:none}
.passport-stamp{display:block;width:100%;height:100%;object-fit:contain}
.bigstamp{background:none;border:0;box-shadow:none}
.cert-emblem{display:block;width:75px;height:auto;margin:0 auto 8px}
@media(max-width:410px){.book{gap:4px}.slot{width:32px;height:32px}.stop-title{font-size:21px}}

.levels.games{flex-wrap:wrap}
.levels.games .btn.lv{flex:1 1 calc(25% - 10px);min-width:76px;font-size:14px}
.wzoom{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.wzoom .zb{font:700 13px var(--body);padding:6px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer}
.wzoom .zb.on{background:var(--teal);color:var(--paper-2)}
.world{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:14px;background:#CFE3EA}
.world .wsea{fill:#CFE3EA}
.world .ctry{fill:#F3E6C8;stroke:#25303B;stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer;outline:none}
.world .ctry:hover,.world .ctry:focus-visible{fill:var(--mustard)}
.world .ctry.good{fill:var(--good)!important}
.world .ctry.bad{fill:var(--bad)!important;animation:pop .4s}
.world .wline .hit{stroke:transparent;stroke-width:26;cursor:pointer}
.world .wline .vis{stroke:#C6502D;stroke-width:3;stroke-dasharray:10 7;pointer-events:none}
.world .wline.good .vis{stroke:#4E8A5A;stroke-dasharray:none}
.world .odot .hit{fill:transparent;cursor:pointer}
.world .odot .vis{fill:#2E7D7A;stroke:#25303B;stroke-width:3;pointer-events:none}
.world .odot.good .vis{fill:#4E8A5A}
.world .wlab{font:800 17px var(--body);fill:#25303B;paint-order:stroke;stroke:#CFE3EA;stroke-width:4px;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var gameStorage=window.writegrowGameStorage||{getItem:function(k){return localStorage.getItem(k);},setItem:function(k,v){localStorage.setItem(k,v);},removeItem:function(k){localStorage.removeItem(k);}};
function $(s,el){return (el||document).querySelector(s);}
function $$(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s));}

var JPG={scenes:1,postcards:1,landforms:1,routes:1};
function artPath(folder,name){return 'art/'+folder+'/'+name+(JPG[folder]?'.jpg':'.png');}
function picture(folder,name,cls,alt){
  return '<img class="'+cls+'" src="'+artPath(folder,name)+'" alt="'+esc(alt||'')+'">';
}
function scenery(name,alt){
  return picture('scenes',name,'scene-art',alt);
}
function reaction(mood){
  var portrait=$('#reaction');
  if(!portrait)return;
  var ch=portrait.dataset.character;
  portrait.src=!mood?portrait.dataset.pose:(mood==='happy'&&THEME().happy[ch])?artPath('poses',THEME().happy[ch]):artPath('reactions',ch+'-'+mood);
}

/* ---------- scene 3: capitals ---------- */
function runCapitals(el,done){
  var PAIRS=[
    {s:'California',c:'Sacramento',f:'Sacramento was a busy supply town during the Gold Rush.'},
    {s:'Texas',c:'Austin',f:'Austin is named for Stephen F. Austin, called the Father of Texas.'},
    {s:'New York',c:'Albany',f:'The capital is Albany, not New York City. It sits on the Hudson River.'},
    {s:'Florida',c:'Tallahassee',f:'The capital is not Miami or Orlando. Tallahassee is up in the Panhandle.'},
    {s:'Illinois',c:'Springfield',f:'Abraham Lincoln lived in Springfield before he became president.'},
    {s:'Alaska',c:'Juneau',f:'No road connects Juneau to the rest of Alaska. You arrive by boat or plane.'}
  ];
  PAIRS=lvl()==='challenge'?deal(CH.capitals.concat(EX.challenge.capitals),8):deal(PAIRS.concat(EX.easy.capitals),6);
  window.__q={capitals:PAIRS};
  function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}return a;}
  var sts=PAIRS.map(function(p){return p.s;}),caps=shuffle(PAIRS.map(function(p){return p.c;}));
  var matched={},sel=null;
  el.innerHTML='<p class="qtext">Match each state to its capital city. Tap a state, then tap its capital.</p>'+
    '<div class="meta" style="margin-top:8px">Matched <b id="cn">0</b> of '+PAIRS.length+'</div>'+
    '<div class="cols"><div class="stack" id="ls"></div><div class="stack" id="rs"></div></div>'+
    '<div class="msg" id="msg" role="status" aria-live="polite"></div><div id="hb"></div>';
  var L=$('#ls',el),R=$('#rs',el),msg=$('#msg',el),H=Hints($('#hb',el));
  function btn(txt,side){var b=document.createElement('button');b.type='button';b.className='pick';b.textContent=txt;b.setAttribute('data-side',side);b.setAttribute('data-v',txt);return b;}
  sts.forEach(function(s){L.appendChild(btn(s,'s'));});
  caps.forEach(function(c){R.appendChild(btn(c,'c'));});
  function pairOf(state){return PAIRS.filter(function(p){return p.s===state;})[0];}
  function firstOpen(){return PAIRS.filter(function(p){return !matched[p.s];})[0];}
  H.set([
    function(){var p=firstOpen();return 'The capital of '+p.s+' starts with the letter "'+p.c.charAt(0)+'".';},
    function(){var p=firstOpen();return 'The capital of '+p.s+' has '+p.c.length+' letters.';},
    function(){var p=firstOpen();return 'The capital of '+p.s+' is not its biggest city.';}
  ]);
  function clear(){$$('.pick.sel',el).forEach(function(b){b.classList.remove('sel');});sel=null;}
  el.addEventListener('click',function(e){
    var b=e.target.closest('.pick');if(!b||b.classList.contains('done'))return;
    var side=b.getAttribute('data-side');
    if(!sel||sel.side===side){clear();sel={side:side,v:b.getAttribute('data-v'),b:b};b.classList.add('sel');sfx('tick');say(msg,'');return;}
    var state=side==='s'?b.getAttribute('data-v'):sel.v,cap=side==='c'?b.getAttribute('data-v'):sel.v;
    var p=pairOf(state),other=sel.b;
    if(p.c===cap){
      matched[state]=true;sfx('ok');
      [b,other].forEach(function(x){x.classList.remove('sel');x.classList.add('done');});
      sel=null;
      var n=Object.keys(matched).length;$('#cn',el).textContent=n;
      say(msg,p.c+' is the capital of '+p.s+'. '+p.f,'ok');
      if(n===PAIRS.length){setTimeout(done,2300);}
    }else{
      bump('miss',2);sfx('no');
      [b,other].forEach(function(x){flash(x,'wrong');x.classList.remove('sel');});
      sel=null;say(msg,'Those two do not go together. Try again.','no');
    }
  });
}

/* ---------- grade 3: map skills ---------- */

function kindIcon(k,px){var h=px||44;return '<svg class="ico-svg" viewBox="-28 -26 56 52" width="'+h+'" height="'+Math.round(h*52/56)+'" aria-hidden="true">'+icon(k,0,0,1)+'</svg>';}

function placeTown(kinds,counts){
  var cells=[],r,c;for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)cells.push({c:c,r:r});
  cells=deal(cells,cells.length);var items=[],p=0;

  return items;

function runPack(el,done,P){
  var hard=lvl()==='challenge',qs=pick6(P.pool[hard?'hard':'easy']);
  var cfg={label:P.label,idx:P.idx,done:done,qs:qs};
  window.__q=window.__q||{};window.__q['pack'+P.idx]=qs;
  if(P.kind==='us'){
    cfg.mapHTML=usTapSVG();
    qs.forEach(function(q){q.wrong=function(v){return 'That is '+NAMES[v]+'. Try again.';};});
  }else if(P.kind==='tx'){
    cfg.mapHTML=txSVGz(P.names,P.vb,P.sc);
    qs.forEach(function(q){q.wrong=function(v){return 'That is '+(TXLAB[v]||v)+'. Try again.';};});
  }else{
    var o=P.wopts?P.wopts(hard):{};
    cfg.mapHTML=worldSVG(o);cfg.top=zoomBar();
    cfg.norm=function(v,q){if(CNAME[q.a]&&WORLD.cont[v]){var c=WORLD.cont[v];return (c===q.a||ALT[v]===q.a)?q.a:c;}return v;};
    cfg.onCorrect=function(q,mw,tgt){
      if(CNAME[q.a]){$$('.ctry',mw).forEach(function(p){var n=p.getAttribute('data-tap');if(WORLD.cont[n]===q.a||ALT[n]===q.a)p.classList.add('good');});}
      else tgt.classList.add('good');
    };
    cfg.setup=function(el2,mw){
      var svg=$('svg',mw);
      $$('.zb',el2).forEach(function(b){b.addEventListener('click',function(){
        svg.setAttribute('viewBox',b.getAttribute('data-vb'));
        $$('.zb',el2).forEach(function(x){x.classList.toggle('on',x===b);});sfx('tick');
      });});
    };
    qs.forEach(function(q){q.wrong=function(v){
      if(CNAME[v])return 'That country is in '+CNAME[v]+'. Try again.';
      if(WORLD.paths[v])return 'That is '+wname(v)+'. Try again.';
      return 'That is the '+v+'. Try again.';
    };});
  }
  mapStop(el,cfg);
}

  bindSound();
  var play=$('#play');
  play.innerHTML='<div class="slots" id="sl"></div><div class="tiles" id="tl"></div><div class="row"><button class="btn alt" id="try" type="button" disabled>Open the trunk</button><button class="btn ghost" id="clr" type="button">Clear</button></div><div class="msg" id="msg" role="status" aria-live="polite" style="text-align:center"></div><div id="hb"></div>';
  var placed=[],sl=$('#sl'),tl=$('#tl'),msg=$('#msg'),tryB=$('#try'),H=Hints($('#hb'));
  H.set(THEME().hints);
  var opening=false;
  function draw(){
    sl.innerHTML='';tl.innerHTML='';
    for(var k=0;k<5;k++){
      (function(k){
        var b=document.createElement('button');b.type='button';b.className='vslot'+(placed[k]!==undefined?' full':'');
        b.textContent=placed[k]!==undefined?S.letters[placed[k]]:'';b.setAttribute('aria-label','Slot '+(k+1));
        b.addEventListener('click',function(){if(!opening&&placed[k]!==undefined){placed.splice(k,1);sfx('tick');draw();}});

      })(k);
    }
    S.letters.forEach(function(L,k){
      var b=document.createElement('button');b.type='button';b.className='vtile';b.textContent=L;b.disabled=placed.indexOf(k)!==-1;b.setAttribute('aria-label','Letter '+L);
      b.addEventListener('click',function(){if(!opening&&placed.length<5){placed.push(k);sfx('tick');draw();}});
      tl.appendChild(b);
    });
    tryB.disabled=placed.length<5;
  }
  $('#clr').addEventListener('click',function(){placed=[];say(msg,'');draw();});
  tryB.addEventListener('click',function(){
    if(opening)return;
    var word=placed.map(function(k){return S.letters[k];}).join('');
    if(word===THEME().word){
      opening=true;sfx('stamp');tryB.disabled=true;$('#clr').disabled=true;

    }else{
      bump('miss',5);sfx('no');flash(sl,'shake');
      say(msg,'The lock stays shut. Try a different order.','no');
    }
  });
  draw();
}
